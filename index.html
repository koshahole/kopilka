<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Копилка и Бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f4f6f8;--surface:#fff;--surface-2:#f8fafb;--surface-3:#eef2f5;
  --text:#18212b;--muted:#71808d;--border:#e3e8ed;--primary:#2563eb;--primary-2:#1d4ed8;
  --primary-soft:#eaf1ff;--success:#16845a;--success-soft:#e7f6ef;--danger:#c83b46;--danger-soft:#fcecef;
  --warning:#a66a00;--shadow:0 8px 30px rgba(25,35,45,.06);--shadow-lg:0 18px 50px rgba(25,35,45,.12);
  --radius:18px;--radius-sm:12px;--sidebar:228px;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}body{background:var(--bg);min-height:100vh;color:var(--text);font-size:14px;line-height:1.45}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 25%,transparent);outline-offset:2px}
.app{max-width:1220px;margin:0 auto;min-height:100vh;padding:24px;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);grid-template-rows:auto 1fr;gap:18px 24px}
#tabs{grid-column:1;grid-row:1/3;align-self:start;position:sticky;top:24px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;z-index:20}
.nav-brand{padding:8px 10px 13px;border-bottom:1px solid var(--border);margin-bottom:5px}.nav-brand strong{display:block;font-size:1rem;letter-spacing:-.02em}.nav-brand span{display:block;color:var(--muted);font-size:.65rem;margin-top:2px;font-weight:700}.tabs button{width:100%;border:0;background:transparent;color:var(--muted);padding:12px 13px;border-radius:12px;text-align:left;font-size:.88rem;font-weight:700;transition:.18s;display:flex;align-items:center;gap:10px}
.tabs button:hover{background:var(--surface-2);color:var(--text)}.tabs button.active{background:var(--primary);color:#fff;box-shadow:0 8px 18px color-mix(in srgb,var(--primary) 24%,transparent)}
.header{grid-column:2;grid-row:1;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);position:relative}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.title h1{font-size:1.25rem;line-height:1.2;font-weight:800;letter-spacing:-.02em;color:var(--text)}
.title .sub{font-size:.76rem;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.online-badge{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;color:var(--muted)}
.online-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px var(--success-soft);animation:pulse 1.8s infinite}.online-dot.offline{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft);animation:none}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.header-actions{display:flex;align-items:center;gap:8px}.add-btn{border:0;background:var(--primary);color:#fff;border-radius:11px;padding:10px 14px;font-size:.82rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 7px 16px color-mix(in srgb,var(--primary) 22%,transparent);transition:.16s}.add-btn:hover{background:var(--primary-2);transform:translateY(-1px)}.add-btn:active{transform:scale(.97)}
.icon-btn{width:38px;height:38px;border:1px solid var(--border);border-radius:11px;background:var(--surface-2);color:var(--text);font-size:1rem;display:inline-flex;align-items:center;justify-content:center}.icon-btn:hover{background:var(--surface-3)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat-box{background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:11px 13px}.stat-box .label{font-size:.62rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800}.stat-box .value{font-size:1.05rem;font-weight:800;color:var(--text);line-height:1.2;margin-top:3px}.stat-box .value small{font-size:.7rem;color:var(--muted)}.stat-box.accent{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 18%,var(--border))}.stat-box.accent .value{color:var(--primary)}
.progress-bar-bg{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:16px}.progress-fill{height:100%;background:var(--primary);border-radius:99px;transition:width .3s}.progress-line{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);font-weight:700;margin-top:7px}
#tabContent{grid-column:2;grid-row:2;min-width:0}.section{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}.section h2,.section h3{font-size:.92rem;font-weight:800;color:var(--text);margin-bottom:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.bills-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.bill-chip{border-radius:12px;padding:11px 7px;text-align:center;color:#fff;font-weight:800;font-size:.75rem;box-shadow:none}.bill-chip[data-n="100"]{background:#8b7440}.bill-chip[data-n="200"]{background:#466b9f}.bill-chip[data-n="500"]{background:#5f7d48}.bill-chip[data-n="1000"]{background:#824d4d}.bill-chip .num{font-size:1rem;line-height:1}.bill-chip .lbl{font-size:.58rem;opacity:.88;margin-top:4px;text-transform:uppercase;letter-spacing:.3px}
.chart-tabs{display:flex;gap:4px;background:var(--surface-3);border-radius:11px;padding:4px;margin-bottom:14px;overflow:auto}.chart-tabs button{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:8px;font-size:.72rem;font-weight:800;white-space:nowrap}.chart-tabs button.active{background:var(--surface);color:var(--text);box-shadow:0 2px 7px rgba(20,30,40,.08)}
.chart-wrap{min-height:230px}.charts-empty,.history-empty{min-height:180px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.82rem;background:var(--surface-2);border:1px dashed var(--border);border-radius:13px}.bar-chart{height:220px;display:flex;align-items:flex-end;gap:7px;padding:18px 3px 0;overflow-x:auto}.bar-col{height:100%;min-width:30px;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}.bar{width:min(30px,80%);min-height:2px;background:var(--primary);border-radius:6px 6px 3px 3px;position:relative}.bar-val{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:.56rem;color:var(--muted);font-weight:800;white-space:nowrap;margin-bottom:3px}.bar-lbl{font-size:.58rem;color:var(--muted);white-space:nowrap}.line-chart{width:100%;height:220px;display:block}.grid-line{stroke:var(--border);stroke-width:1}.line{fill:none;stroke:var(--primary);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.point{fill:var(--primary);stroke:var(--surface);stroke-width:2}.line-chart .lbl{fill:var(--muted);font-size:9px}
.bar-pair{display:flex;gap:3px;align-items:flex-end;width:100%;height:100%;justify-content:center}.bar-pair .b{width:45%;max-width:20px;min-height:2px;border-radius:4px 4px 2px 2px}.bar-pair .b.income{background:var(--success)}.bar-pair .b.expense{background:var(--danger)}

/* ============ Транзакции (в списке и в модалке дня) ============ */
.tx-list{display:flex;flex-direction:column}
.tx-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--border)}
.tx-item:last-child{border-bottom:0}
.tx-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex:0 0 auto}
.tx-info{flex:1;min-width:0}
.tx-info .cat{font-size:.8rem;font-weight:800;color:var(--text)}
.tx-info .meta{font-size:.68rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.tx-amount{font-size:.82rem;font-weight:850;white-space:nowrap}
.tx-item.income  .tx-amount{color:var(--success)}
.tx-item.expense .tx-amount{color:var(--danger)}
.tx-delete{width:28px;height:28px;border:0;border-radius:8px;background:var(--danger-soft);color:var(--danger);font-weight:800;margin-left:4px}

/* ============ Выбор категории в модалке ============ */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.cat-pick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border:1px solid var(--border);background:var(--surface-2);border-radius:10px;cursor:pointer;transition:.15s;text-align:center}
.cat-pick:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--border))}
.cat-pick.active{border-color:var(--primary);background:var(--primary-soft)}
.cat-pick .emoji{font-size:1.1rem;line-height:1}
.cat-pick .lbl{font-size:.66rem;font-weight:750;color:var(--text);line-height:1.1;word-break:break-word}

/* ============ Управление категориями ============ */
.cat-manage-row{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;margin-bottom:7px}
.cat-manage-row .cat-del{border:0;background:transparent;color:var(--danger);font-weight:800;cursor:pointer;font-size:1rem;padding:4px 8px;border-radius:6px}
.cat-manage-row .cat-del:hover{background:var(--danger-soft)}

/* ============ Топ расходов ============ */
.cat-stat-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.cat-stat-row .emoji{font-size:1.1rem;width:26px;text-align:center}
.cat-stat-row .label{flex:1;font-size:.8rem;font-weight:700}
.cat-stat-row .bar-bg{flex:1.2;height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.cat-stat-row .bar-fill{height:100%;border-radius:99px;transition:width .3s}
.cat-stat-row .amount{font-size:.78rem;font-weight:800;min-width:78px;text-align:right}

/* ============ Баланс ============ */
.balance-card{background:var(--text);color:#fff;border-radius:17px;padding:19px 20px}
.balance-card .label{font-size:.68rem;color:rgba(255,255,255,.6);font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.balance-card .value{font-size:1.65rem;font-weight:850;line-height:1.15;margin-top:4px}
.balance-card .value.negative{color:#ff9da4}
.balance-card .row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:17px;padding-top:13px;border-top:1px solid rgba(255,255,255,.12)}
.balance-card .row .col{min-width:0}
.balance-card .row .value{font-size:.9rem;margin-top:2px}
.balance-card .value.income{color:#8fe0b9}
.balance-card .value.expense{color:#ff9da4}

/* ============ Календарь ============ */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-nav{display:flex;gap:5px}
.cal-nav button{width:34px;height:34px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text)}
.cal-title{font-size:1rem;font-weight:850}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0 5px}
.cal-weekdays>div{text-align:center;color:var(--muted);font-size:.6rem;font-weight:800;padding:3px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-day{position:relative;min-height:66px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);padding:6px 6px 8px;cursor:pointer;transition:.15s;overflow:hidden}
.cal-day:hover{border-color:color-mix(in srgb,var(--primary) 35%,var(--border));transform:translateY(-1px)}
.cal-day.empty{background:transparent;border:0;cursor:default;min-height:66px}
.cal-day.empty:hover{transform:none}
.cal-day.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.cal-day.has-income{background:var(--success-soft);border-color:color-mix(in srgb,var(--success) 25%,var(--border))}
.cal-day.has-expense{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 25%,var(--border))}
.cal-day.has-both{background:linear-gradient(135deg,var(--danger-soft) 0%,var(--danger-soft) 50%,var(--success-soft) 50%,var(--success-soft) 100%)}
.cal-day.has-savings{border-color:#c4a356}
.cal-day .num{font-size:.7rem;font-weight:850;color:var(--text)}
.cal-day .sums{display:flex;flex-direction:column;gap:1px;margin-top:4px;font-size:.58rem;font-weight:800;line-height:1.15}
.cal-day .sums .inc{color:var(--success)}
.cal-day .sums .exp{color:var(--danger)}
.cal-day .savings-dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#c4a356}
.cal-day .sums-savings{margin-top:2px;font-size:.55rem;font-weight:800;color:#a6833a}

/* ============ Тема ============ */
.theme-panel{position:fixed;top:22px;right:max(22px,calc((100vw - 1220px)/2 + 22px));width:245px;background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:13px;box-shadow:var(--shadow-lg);display:none;z-index:100}.theme-panel.show{display:block;animation:pop .16s ease}@keyframes pop{from{opacity:0;transform:translateY(-5px) scale(.98)}to{opacity:1;transform:none}}.theme-panel-title{font-size:.72rem;font-weight:850;color:var(--muted);margin-bottom:9px}.theme-options{display:grid;grid-template-columns:1fr 1fr;gap:7px}.theme-option{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:10px;padding:9px;text-align:left;font-size:.72rem;font-weight:800;display:flex;align-items:center;gap:7px}.theme-option.active{border-color:var(--primary);background:var(--primary-soft)}.theme-dot{width:13px;height:13px;border-radius:50%;flex:0 0 auto}.theme-dot.light{background:#5b73f2}.theme-dot.dark{background:#202738}.theme-dot.pink{background:#e65a91}.theme-dot.green{background:#2b9a76}

/* ============ Модалки ============ */
.modal-bg{position:fixed;inset:0;background:rgba(10,18,25,.48);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px;z-index:200}.modal-bg.show{display:flex}.modal{width:min(100%,500px);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow-lg)}.modal h2{font-size:1.05rem;margin-bottom:18px}.form-row{margin-bottom:15px}.form-row label{display:block;font-size:.72rem;font-weight:800;color:var(--muted);margin-bottom:6px}.form-row input{width:100%;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:10px;padding:11px 12px;font-size:.82rem}.form-row input:focus{border-color:var(--primary);background:var(--surface)}.bill-inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bill-input{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:8px;text-align:center}.bill-input .lbl{display:block;font-size:.65rem;font-weight:800;color:var(--muted);margin-bottom:5px}.bill-input input{text-align:center;padding:8px}.modal-total{text-align:center;font-size:1.65rem;font-weight:900;padding:13px;border-radius:12px;background:var(--primary-soft);color:var(--primary);margin:8px 0 16px}.modal-total small{font-size:.75rem}.modal-actions{display:flex;gap:8px}.btn-cancel,.btn-save{flex:1;border:0;border-radius:10px;padding:11px;font-size:.8rem;font-weight:850}.btn-cancel{background:var(--surface-3);color:var(--text)}.btn-save{background:var(--primary);color:#fff}.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--surface-3);padding:4px;border-radius:11px;margin-bottom:15px}.type-toggle button{border:0;background:transparent;color:var(--muted);padding:9px;border-radius:8px;font-size:.76rem;font-weight:800}.type-toggle button.active{background:var(--surface);color:var(--text);box-shadow:0 2px 7px rgba(20,30,40,.08)}
.emoji-grid,.color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.emoji-grid button,.color-grid button{border:1px solid var(--border);background:var(--surface-2);border-radius:8px;min-height:34px}.emoji-grid button.active{border-color:var(--primary);background:var(--primary-soft)}.color-grid button.active{outline:3px solid var(--text);outline-offset:2px}

/* ============ Тост / синхронизация ============ */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(15px);opacity:0;pointer-events:none;background:var(--text);color:#fff;border-radius:10px;padding:9px 13px;font-size:.75rem;font-weight:750;z-index:300;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.error{background:var(--danger)}
.syncing{position:fixed;top:12px;left:50%;transform:translateX(-50%) translateY(-10px);opacity:0;pointer-events:none;background:var(--text);color:#fff;border-radius:99px;padding:7px 11px;font-size:.68rem;z-index:300;transition:.2s}.syncing.show{opacity:1;transform:translateX(-50%) translateY(0)}.spinner{display:inline-block;width:10px;height:10px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:5px}@keyframes spin{to{transform:rotate(360deg)}}

body[data-theme="dark"]{--bg:#0d1117;--surface:#151b23;--surface-2:#10161e;--surface-3:#1c2530;--text:#edf2f7;--muted:#8e9aa7;--border:#27313d;--primary:#6f8cff;--primary-2:#5d7cff;--primary-soft:#1c2948;--success:#5bd09a;--success-soft:#153427;--danger:#ff7882;--danger-soft:#3b1d23;--shadow:0 8px 30px rgba(0,0,0,.18);--shadow-lg:0 18px 50px rgba(0,0,0,.4)}
body[data-theme="pink"]{--primary:#d84f88;--primary-2:#c83f77;--primary-soft:#fdeaf2;--success:#16845a;--success-soft:#e7f6ef}
body[data-theme="green"]{--primary:#198765;--primary-2:#117052;--primary-soft:#e7f6ef;--success:#16845a;--success-soft:#e7f6ef}
body[data-theme="dark"] .balance-card{background:#0b1016}

@media(max-width:760px){
 .app{display:block;padding:12px 12px 86px}.header{margin-bottom:12px;padding:16px}.header-top{align-items:center}.title h1{font-size:1.05rem}.header-actions .add-btn{padding:9px 11px;font-size:.72rem}.stats-grid{gap:6px}.stat-box{padding:9px 8px}.stat-box .value{font-size:.88rem}
 #tabs .nav-brand{display:none} #tabs{position:fixed;left:10px;right:10px;bottom:10px;top:auto;z-index:150;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.15)}.tabs button{justify-content:center;text-align:center;padding:9px 4px;font-size:.68rem;gap:4px}.tabs button.active{box-shadow:none}
 .section{padding:14px;margin-bottom:10px}.bills-row{gap:6px}.bill-chip{padding:9px 4px}.bill-chip .num{font-size:.9rem}.chart-wrap{min-height:205px}.bar-chart,.line-chart{height:195px}.balance-card .value{font-size:1.4rem}.tx-info .meta{max-width:170px}.cal-weekdays{gap:3px}.cal-grid{gap:3px}.cal-day{min-height:52px;padding:5px}.cal-day .sums{font-size:.5rem}.cal-day .num{font-size:.65rem}.theme-panel{top:auto;bottom:72px;right:12px;width:220px}.modal{padding:17px;border-radius:17px}.bill-inputs{gap:5px}.emoji-grid,.color-grid{grid-template-columns:repeat(6,1fr)}
}
@media(max-width:420px){.header-actions .add-btn{font-size:0;width:38px;height:38px;padding:0}.header-actions .add-btn:first-letter{font-size:1.1rem}.stats-grid .label{font-size:.54rem}.stats-grid .value{font-size:.78rem}.bills-row{grid-template-columns:repeat(2,1fr)}.cat-grid{grid-template-columns:repeat(2,1fr)}.balance-card .row{gap:10px}.cal-day{min-height:46px}.cal-day .sums{font-size:.46rem}}
</style>
</head>
<body>
<div class="app">

  <div class="header" id="header"></div>

  <div class="theme-panel" id="themePanel">
    <div class="theme-panel-title">Тема оформления</div>
    <div class="theme-options">
      <button class="theme-option" data-theme-choice="light"><span class="theme-dot light"></span>Светлая</button>
      <button class="theme-option" data-theme-choice="dark"><span class="theme-dot dark"></span>Тёмная</button>
      <button class="theme-option" data-theme-choice="pink"><span class="theme-dot pink"></span>Розовая</button>
      <button class="theme-option" data-theme-choice="green"><span class="theme-dot green"></span>Зелёная</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <div class="nav-brand"><strong>Копилка</strong><span>Финансы</span></div>
    <button data-tab="savings" class="active">🏦 Копилка</button>
    <button data-tab="budget">💳 Бюджет</button>
    <button data-tab="calendar">📅 Календарь</button>
  </div>

  <div id="tabContent"></div>

</div>

<!-- Модалка: копилка -->
<div class="modal-bg" id="modalSavings">
  <div class="modal">
    <h2>💰 Отложить в копилку</h2>
    <div class="form-row">
      <label>Дата</label>
      <input type="date" id="svDate">
    </div>
    <div class="form-row">
      <label>Сколько купюр</label>
      <div class="bill-inputs">
        <div class="bill-input" data-n="100">
          <span class="lbl">100 ₽</span>
          <input type="number" min="0" inputmode="numeric" value="0" id="sv100">
        </div>
        <div class="bill-input" data-n="200">
          <span class="lbl">200 ₽</span>

<div class="toast" id="toast"></div>
<div class="syncing" id="syncing"><span class="spinner"></span> Синхронизация…</div>

<script>
(function() {
  // ============ Константы ============
  const TARGET_SUM = 300000;
  const EMOJI_SET = ['🛒','☕','🚌','🏠','💊','🎬','🛍️','💡','📱','🚗','✈️','🎁',
                     '💼','💻','💳','🎓','🐶','👶','🏋️','🎮','🍕','🍺','🌸','📌',
                     '💰','💸','📈','📉','🎯','🏦','🎉','❤️'];
  const COLOR_SET = ['#e5484d','#c4a356','#2ec27e','#5b8ac9','#9a5b5b','#7e9c62',
                     '#8e44ad','#e67e22','#16a085','#7a99ac','#2b7a9c','#0b2b3f'];

  // ============ Telegram ============
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // ============ DOM ============
  const $ = id => document.getElementById(id);

  // ============ Тема ============
  function applyTheme(theme) {
    const allowed = ['light','dark','pink','green'];
    if (!allowed.includes(theme)) theme = 'light';
    document.body.dataset.theme = theme;
    localStorage.setItem('kopilka_theme', theme);
    document.querySelectorAll('.theme-option').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.themeChoice === theme);
    });
  }
  function openThemePanel() {
    const panel = $('themePanel');
    panel.classList.toggle('show');
    const current = localStorage.getItem('kopilka_theme') || 'light';
    document.querySelectorAll('.theme-option').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.themeChoice === current);
    });
  }
  function initTheme() {
    applyTheme(localStorage.getItem('kopilka_theme') || 'light');
    document.querySelectorAll('.theme-option').forEach(btn => {
      btn.onclick = () => {
        applyTheme(btn.dataset.themeChoice);
        $('themePanel').classList.remove('show');
        vibrate('light');
      };
    });
    document.addEventListener('click', e => {
      if (!$('themePanel').contains(e.target) && !e.target.closest('#themeBtn')) {
        $('themePanel').classList.remove('show');
      }
    });
  }

  // ============ Состояние ============
  const STATE = {
    tab: 'savings',
    entries: [],
    summary: null,
    stats: null,
    transactions: [],
    budget: null,
    budgetStats: null,
    categories: { income: [], expense: [] },
    currentUser: localStorage.getItem('kopilka_user') || 'Я',
    calView: new Date(),
    txType: 'expense',
    txCatId: null,
    catType: 'expense',
    pickedEmoji: '📌',
    pickedColor: '#7a99ac',
    selectedDateForAction: null,
  };

  // ============ Утилиты ============
  function showToast(msg, isError) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('error', !!isError);
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function showSyncing(v) { $('syncing').classList.toggle('show', v); }
  function setOnline(v) {
    const dot = document.querySelector('.online-dot');
    const txt = $('onlineText');
    if (dot) dot.classList.toggle('offline', !v);
    if (txt) txt.textContent = v ? 'Синхронизировано' : 'Офлайн';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }
  function fmtMoney(n) { return Math.round(n).toLocaleString('ru-RU'); }
  function fmtShort(n) {
    if (n >= 1000) return Math.round(n/100)/10 + 'k';
    return String(Math.round(n));
  }
  function todayStr() {
    const d = new Date();
    const p = x => String(x).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  }
  function vibrate(type) {
    if (!tg?.HapticFeedback) return;
    if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
    else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
    else tg.HapticFeedback.impactOccurred(type || 'light');
  }

  // ============ API ============
  async function apiGet(url) {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(url + ' ' + r.status);
    return r.json();
  }
  async function apiPost(url, body) {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(url + ' ' + r.status);
    return r.json();
  }
  async function apiDelete(url, body) {
    const r = await fetch(url, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(url + ' ' + r.status);
    return r.json();
  }

  // ============ Загрузка данных ============
  // opts.silent = true — не показывать спиннер и не перерисовывать UI, если открыта модалка
  // opts.forceRender = true — перерисовать даже если открыта модалка (для сохранений)
  async function reload(opts = {}) {
    const silent = opts.silent === true;
    const forceRender = opts.forceRender === true;
    if (!silent) showSyncing(true);
    try {
      const [e, s, st, tx, b, bs, cats] = await Promise.all([
        apiGet('/api/entries'),
        apiGet('/api/summary'),
        apiGet('/api/stats'),
        apiGet('/api/transactions'),
        apiGet('/api/budget'),
        apiGet('/api/budget-stats'),
        apiGet('/api/categories'),
      ]);
      STATE.entries = e.entries || [];
      STATE.summary = s;
      STATE.stats = st;
      STATE.transactions = tx.transactions || [];
      STATE.budget = b;
      STATE.budgetStats = bs;
      STATE.categories = cats.categories || { income: [], expense: [] };
      setOnline(true);

      // Не перерисовываем страницу, если открыта модалка, — иначе сбрасывается ввод
      const anyModalOpen = !!document.querySelector('.modal-bg.show');
      if (forceRender || !anyModalOpen) {
        renderCurrentTab();
      }
    } catch (err) {
      console.error(err);
      setOnline(false);
      if (!silent) showToast('Не удалось загрузить данные', true);
    } finally {
      if (!silent) showSyncing(false);
    }
  }

  // ============ Переключение вкладок ============
  function switchTab(tab) {
    STATE.tab = tab;
    document.querySelectorAll('.tabs button').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    renderCurrentTab();
  }

  function renderCurrentTab() {
    if (STATE.tab === 'savings')  renderSavingsTab();
    if (STATE.tab === 'budget')   renderBudgetTab();
    if (STATE.tab === 'calendar') renderCalendarTab();

    const themeBtn = $('themeBtn');
    if (themeBtn) themeBtn.onclick = openThemePanel;
  }

  // =================================================================
  // ==================== ВКЛАДКА «КОПИЛКА» ==========================
  // =================================================================
  function renderSavingsTab() {
    const s = STATE.summary;
    $('header').innerHTML = `
      <div class="header-top">
        <div class="title">
          <h1>🏦 Копилка 300 000 ₽</h1>
          <div class="sub">
            <span>Вместе 💑</span>
            <span class="online-badge">
              <span class="online-dot"></span>
              <span id="onlineText">Подключение…</span>
            </span>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="themeBtn" aria-label="Тема">◐</button>
          <button class="add-btn" id="openSavingsBtn">＋ Отложить</button>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-box accent">
          <div class="label">Всего</div>
          <div class="value">${fmtMoney(s.totalAll)} <small>₽</small></div>
        </div>
        <div class="stat-box">
          <div class="label">За месяц</div>
          <div class="value">${fmtMoney(s.totalMonth)} <small>₽</small></div>
        </div>
        <div class="stat-box">
          <div class="label">За неделю</div>
          <div class="value">${fmtMoney(s.totalWeek)} <small>₽</small></div>
        </div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-fill" style="width:${s.percent}%"></div>
      </div>
      <div class="progress-line">
        <span>${s.percent}%</span>
        <span>Осталось: ${fmtMoney(s.remaining)} ₽</span>
      </div>
    `;
    $('openSavingsBtn').onclick = () => openSavingsModal();

    $('tabContent').innerHTML = `
      <div class="section">
        <h2>💵 Купюры в копилке</h2>
        <div class="bills-row">
          <div class="bill-chip" data-n="100">
            <div class="num">${s.byNominal[100]||0}</div>
            <div class="lbl">по 100 ₽</div>
          </div>
          <div class="bill-chip" data-n="200">
            <div class="num">${s.byNominal[200]||0}</div>
            <div class="lbl">по 200 ₽</div>
          </div>
          <div class="bill-chip" data-n="500">
            <div class="num">${s.byNominal[500]||0}</div>
            <div class="lbl">по 500 ₽</div>
          </div>
          <div class="bill-chip" data-n="1000">
            <div class="num">${s.byNominal[1000]||0}</div>
            <div class="lbl">по 1000 ₽</div>
          </div>
        </div>
      </div>

      <div class="section">
        <h2>📊 Статистика копилки</h2>
        <div class="chart-tabs" id="savingsTabs">
          <button data-tab="month" class="active">Месяцы</button>
          <button data-tab="week">Недели</button>
          <button data-tab="cumulative">Накопление</button>
          <button data-tab="weekday">Дни</button>
        </div>
        <div class="chart-wrap" id="savingsChart"></div>
      </div>

      <div class="section">
        <h2>📜 История копилки</h2>
        <div id="savingsHistory"></div>
      </div>
    `;

    renderSavingsChart('month');
    document.querySelectorAll('#savingsTabs button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#savingsTabs button').forEach(b =>
          b.classList.toggle('active', b === btn));
        renderSavingsChart(btn.dataset.tab);
      };
    });

    renderSavingsHistory();
  }

  function renderSavingsHistory() {
    const list = $('savingsHistory');
    const sorted = [...STATE.entries].sort((a, b) =>
      (b.date === a.date)
        ? (b.created_at - a.created_at)
        : (b.date > a.date ? 1 : -1)
    );
    if (sorted.length === 0) {
      list.innerHTML = '<div class="history-empty">Пока пусто — нажмите «Отложить»</div>';
      return;
    }
    list.innerHTML = sorted.map(e => {
      const bills = [];
      if (e.breakdown[1000]) bills.push(`${e.breakdown[1000]}×1000`);
      if (e.breakdown[500])  bills.push(`${e.breakdown[500]}×500`);
      if (e.breakdown[200])  bills.push(`${e.breakdown[200]}×200`);
      if (e.breakdown[100])  bills.push(`${e.breakdown[100]}×100`);
      const d = new Date(e.date + 'T00:00:00');
      const dateStr = d.toLocaleDateString('ru-RU',
        { day: '2-digit', month: '2-digit', year: 'numeric' });
      return `
        <div class="history-item">
          <div>
            <span class="who">${escapeHtml(e.author)}</span>
            <div class="when">${dateStr} · ${bills.join(', ')}</div>
          </div>
          <div class="right">
            <span class="amount">+${fmtMoney(e.amount)} ₽</span>
            <button class="del" data-id="${e.id}">✕</button>
          </div>
        </div>`;
    }).join('');
    list.querySelectorAll('.del').forEach(btn => {
      btn.onclick = () => deleteEntry(btn.dataset.id);
    });
  }

  async function deleteEntry(id) {
    if (!confirm('Удалить эту запись из копилки?')) return;
    try {
      await apiDelete('/api/entries', { id, author: STATE.currentUser });
      showToast('Запись удалена');
      await reload({ forceRender: true });
    } catch (e) {
      showToast('Ошибка удаления', true);
    }
  }

  function renderSavingsChart(tab) {
    const st = STATE.stats;
    const wrap = $('savingsChart');
    if (!st) { wrap.innerHTML = '<div class="charts-empty">Загружаем…</div>'; return; }

    if (tab === 'month') {
      renderBarChart(st.byMonth, 'label', 'sum', 'Нет данных за 12 месяцев', wrap);
    } else if (tab === 'week') {
      renderBarChart(st.byWeek, 'label', 'sum', 'Нет данных за 12 недель', wrap);
    } else if (tab === 'cumulative') {
      renderLineChart(st.cumulative.map(c => ({ label: c.label, value: c.total })), wrap);
    } else if (tab === 'weekday') {
      renderBarChart(st.weekdays, 'label', 'sum', 'Нет данных', wrap);
    }
  }

  function renderBarChart(data, labelKey, valKey, emptyMsg, wrap) {
    const values = data.map(d => d[valKey]);
    const maxVal = Math.max(...values, 1);
    const allZero = values.every(v => v === 0);
    if (allZero) {
      wrap.innerHTML = `<div class="charts-empty">${emptyMsg}</div>`;
      return;
    }
    wrap.innerHTML = `
      <div class="bar-chart">
        ${data.map(d => {
          const h = Math.max(2, (d[valKey] / maxVal) * 100);
          return `
            <div class="bar-col" title="${fmtMoney(d[valKey])} ₽">
              <div class="bar" style="height:${h}%">
                ${d[valKey] > 0 ? `<div class="bar-val">${fmtShort(d[valKey])}</div>` : ''}
              </div>
              <div class="bar-lbl">${d[labelKey]}</div>
            </div>`;
        }).join('')}
      </div>
    `;
  }

  function renderLineChart(data, wrap) {
    const values = data.map(d => d.value);
    const maxVal = Math.max(...values, 1);
    const minVal = Math.min(...values, 0);
    const allZero = values.every(v => v === 0);
    if (allZero) {
      wrap.innerHTML = '<div class="charts-empty">Нет данных</div>';
      return;
    }

    const W = wrap.clientWidth || 800;
    const H = wrap.clientHeight || 220;
    const padL = 8, padR = 8, padT = 20, padB = 30;
    const innerW = W - padL - padR;
    const innerH = H - padT - padB;
    const n = data.length;
    const range = maxVal - Math.min(minVal, 0) || 1;
    const base = Math.min(minVal, 0);

    const x = i => padL + (n > 1 ? (i / (n - 1)) * innerW : innerW / 2);
    const y = v => padT + innerH - ((v - base) / range) * innerH;

    const points = data.map((d, i) => ({
      x: x(i), y: y(d.value), val: d.value, lbl: d.label
    }));
    const linePath = points.map((p, i) =>
      `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`
    ).join(' ');
    const areaPath = `${linePath} L${points[points.length-1].x.toFixed(1)},${(padT+innerH).toFixed(1)} L${points[0].x.toFixed(1)},${(padT+innerH).toFixed(1)} Z`;

    let gridHtml = '';
    for (let i = 0; i <= 4; i++) {
      const gy = padT + (innerH / 4) * i;
      gridHtml += `<line class="grid-line" x1="${padL}" y1="${gy}" x2="${padL + innerW}" y2="${gy}" />`;
    }
    const pointsHtml = points.map(p =>
      `<circle class="point" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5"><title>${fmtMoney(p.val)} ₽</title></circle>`
    ).join('');
    const labelsHtml = points.map((p, i) => {
      if (i % 2 !== 0 && i !== n - 1) return '';
      return `<text class="lbl" x="${p.x.toFixed(1)}" y="${(H - 8).toFixed(1)}" text-anchor="middle">${p.lbl}</text>`;
    }).join('');

    wrap.innerHTML = `
      <svg class="line-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="gradientArea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2563eb" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${gridHtml}
        <path d="${areaPath}" fill="url(#gradientArea)" opacity="0.5"/>
        <path class="line" d="${linePath}"/>
        ${pointsHtml}
        ${labelsHtml}
      </svg>
    `;
  }

  function openSavingsModal(dateStr) {
    $('svDate').value = dateStr || todayStr();
    $('sv100').value = 0;
    $('sv200').value = 0;
    $('sv500').value = 0;
    $('sv1000').value = 0;
    updateSavingsTotal();
    $('modalSavings').classList.add('show');
    vibrate('light');
  }
  function closeSavingsModal() { $('modalSavings').classList.remove('show'); }
  function updateSavingsTotal() {
    const total =
      (parseInt($('sv100').value) || 0) * 100 +
      (parseInt($('sv200').value) || 0) * 200 +
      (parseInt($('sv500').value) || 0) * 500 +
      (parseInt($('sv1000').value) || 0) * 1000;
    $('svTotal').textContent = fmtMoney(total);
    return total;
  }

  // =================================================================
  // ==================== ВКЛАДКА «БЮДЖЕТ» ===========================
  // =================================================================
  function renderBudgetTab() {
    const b = STATE.budget;
    const balanceClass = b.month.balance < 0 ? 'negative' : '';
    $('header').innerHTML = `

  async function deleteTx(id) {
    if (!confirm('Удалить эту операцию?')) return;
    try {
      await apiDelete('/api/transactions', { id });
      showToast('Операция удалена');
      await reload({ forceRender: true });

      showToast('Ошибка удаления', true);

  function renderBudgetChart(tab) {
    const bs = STATE.budgetStats;
    const wrap = $('budgetChart');
    const extra = $('budgetExtra');
    extra.innerHTML = '';
    if (!bs) { wrap.innerHTML = '<div class="charts-empty">Загружаем…</div>'; return; }

    if (tab === 'monthly') {
      renderDualBarChart(bs.monthly, wrap);
    } else if (tab === 'cumulative') {
      renderLineChart(bs.cumulative.map(c => ({ label: c.label, value: c.value })), wrap);
    } else if (tab === 'topExp') {
      wrap.innerHTML = '';
      renderTopExpenses(bs.topExpenses, extra);
    }
  }

  function renderDualBarChart(monthly, wrap) {
    const maxVal = Math.max(
      ...monthly.map(m => Math.max(m.income, m.expense)), 1
    );
    const allZero = monthly.every(m => m.income === 0 && m.expense === 0);
    if (allZero) {
      wrap.innerHTML = '<div class="charts-empty">Нет данных за 12 месяцев</div>';
      return;
    }
    wrap.innerHTML = `
      <div class="bar-chart">
        ${monthly.map(m => {
          const hIn = Math.max(2, (m.income / maxVal) * 100);
          const hEx = Math.max(2, (m.expense / maxVal) * 100);
          return `
            <div class="bar-col" style="justify-content:flex-end;"
                 title="Доход: ${fmtMoney(m.income)} ₽&#10;Расход: ${fmtMoney(m.expense)} ₽">
              <div class="bar-pair" style="height:100%;">
                <div class="b income"  style="height:${m.income  ? hIn : 0}%"></div>
                <div class="b expense" style="height:${m.expense ? hEx : 0}%"></div>
              </div>
              <div class="bar-lbl">${m.label}</div>
            </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:.72rem;font-weight:600;">
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--success);border-radius:3px;margin-right:4px;vertical-align:middle;"></span>Доход</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--danger);border-radius:3px;margin-right:4px;vertical-align:middle;"></span>Расход</span>
      </div>
    `;
  }

  function renderTopExpenses(topExpenses, wrap) {
    if (!topExpenses || topExpenses.length === 0) {
      wrap.innerHTML = '<div class="charts-empty">Пока нет расходов в этом месяце</div>';
      return;
    }
    const maxAmount = Math.max(...topExpenses.map(t => t.amount), 1);
    wrap.innerHTML = `
      <div style="margin-top:8px;">
        ${topExpenses.map(t => `
          <div class="cat-stat-row">
            <div class="emoji">${t.emoji}</div>
            <div class="label">${escapeHtml(t.label)}</div>
            <div class="bar-bg">

            </div>
            <div class="amount">${fmtMoney(t.amount)} ₽</div>

      </div>
    `;
  }

  async function saveTx() {
    const date = $('txDate').value;
    const amount = parseInt($('txAmount').value) || 0;
    const note = $('txNote').value.trim();
    if (!STATE.txCatId) { showToast('Выберите категорию', true); return; }

    closeTxModal();
    try {

        date, type: STATE.txType, amount,

      showToast(STATE.txType === 'income' ? 'Доход добавлен' : 'Расход добавлен');

  function renderCalendarGrid() {
    const year = STATE.calView.getFullYear();
    const month = STATE.calView.getMonth();

    const incomeByDate = {};
    const expenseByDate = {};
    const savingsByDate = {};
    const savingsCountByDate = {};

    for (const t of STATE.transactions) {
      const d = t.date;
      if (t.type === 'income')  incomeByDate[d]  = (incomeByDate[d]  || 0) + t.amount;
      else                      expenseByDate[d] = (expenseByDate[d] || 0) + t.amount;
    }
    for (const e of STATE.entries) {
      savingsByDate[e.date] = (savingsByDate[e.date] || 0) + e.amount;
      savingsCountByDate[e.date] = (savingsCountByDate[e.date] || 0) + 1;
    }

    const firstDay = new Date(year, month, 1);
    const startWeekday = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStrVal = todayStr();

    let html = '';
    for (let i = 0; i < startWeekday; i++) {
      html += '<div class="cal-day empty"></div>';
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const p = x => String(x).padStart(2, '0');
      const dateStr = `${year}-${p(month+1)}-${p(d)}`;
      const inc = incomeByDate[dateStr] || 0;
      const exp = expenseByDate[dateStr] || 0;
      const sav = savingsByDate[dateStr] || 0;
      const hasInc = inc > 0;
      const hasExp = exp > 0;
      const hasSav = sav > 0;

      const classes = ['cal-day'];
      if (dateStr === todayStrVal) classes.push('today');
      if (hasInc && hasExp) classes.push('has-both');
      else if (hasInc) classes.push('has-income');
      else if (hasExp) classes.push('has-expense');
      if (hasSav) classes.push('has-savings');

      // Внутри ячейки: номер дня, суммы дохода/расхода, сумма копилки, точка копилки
      let inner = `<div class="num">${d}</div>`;

      if (hasInc || hasExp) {
        inner += '<div class="sums">';
        if (hasInc) inner += `<span class="inc">+${fmtShort(inc)}</span>`;
        if (hasExp) inner += `<span class="exp">−${fmtShort(exp)}</span>`;
        inner += '</div>';
      }

      if (hasSav) {
        inner += `<div class="sums-savings">🏦 ${fmtShort(sav)}</div>`;
        inner += '<div class="savings-dot"></div>';
      }

      html += `<div class="${classes.join(' ')}" data-date="${dateStr}">${inner}</div>`;
    }
    $('calGrid').innerHTML = html;

    $('calGrid').querySelectorAll('.cal-day:not(.empty)').forEach(node => {
      node.onclick = () => onDayClick(node.dataset.date);
    });
  }

  function renderMonthSummary() {
    const year = STATE.calView.getFullYear();
    const month = STATE.calView.getMonth();
    const monthKey = `${year}-${String(month + 1).padStart(2, '0')}`;

    let inc = 0, exp = 0, sav = 0;
    for (const t of STATE.transactions) {
      if (t.date.startsWith(monthKey)) {
        if (t.type === 'income') inc += t.amount;
        else exp += t.amount;
      }
    }
    for (const e of STATE.entries) {
      if (e.date.startsWith(monthKey)) sav += e.amount;
    }
    const balance = inc - exp;

    $('monthSummary').innerHTML = `
      <div class="stats-grid" style="grid-template-columns:1fr 1fr 1fr;">
        <div class="stat-box" style="background:var(--success-soft);border-color:color-mix(in srgb,var(--success) 25%,var(--border));">
          <div class="label" style="color:var(--success);">Доходы</div>
          <div class="value" style="color:var(--success);">+${fmtMoney(inc)} <small>₽</small></div>
        </div>
        <div class="stat-box" style="background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 25%,var(--border));">
          <div class="label" style="color:var(--danger);">Расходы</div>
          <div class="value" style="color:var(--danger);">−${fmtMoney(exp)} <small>₽</small></div>
        </div>
        <div class="stat-box" style="background:#f0e6d2;border-color:#d4b980;">
          <div class="label" style="color:#8a6d2a;">Копилка</div>
          <div class="value" style="color:#8a6d2a;">+${fmtMoney(sav)} <small>₽</small></div>
        </div>
      </div>
      <div class="stat-box" style="margin-top:8px;background:${balance >= 0 ? 'var(--success-soft)' : 'var(--danger-soft)'};border-color:${balance >= 0 ? 'color-mix(in srgb,var(--success) 25%,var(--border))' : 'color-mix(in srgb,var(--danger) 25%,var(--border))'};">
        <div class="label">Баланс месяца</div>
        <div class="value" style="color:${balance >= 0 ? 'var(--success)' : 'var(--danger)'};">
          ${balance >= 0 ? '+' : '−'}${fmtMoney(Math.abs(balance))} <small>₽</small>
        </div>
      </div>
    `;
  }

  function onDayClick(dateStr) {
    STATE.selectedDateForAction = dateStr;

    const dayTxs = STATE.transactions.filter(t => t.date === dateStr);
    const dayEntries = STATE.entries.filter(e => e.date === dateStr);

    const d = new Date(dateStr + 'T00:00:00');
    const dateStrHuman = d.toLocaleDateString('ru-RU', {
      day: '2-digit', month: 'long', year: 'numeric'
    });

    if (dayTxs.length === 0 && dayEntries.length === 0) {
      openDayAction(dateStr, dateStrHuman);
      return;
    }

    $('dayListTitle').innerHTML = `📅 ${dateStrHuman}`;

    let html = '';
    if (dayTxs.length > 0) {
      html += '<div style="margin-bottom:12px;"><div style="font-weight:800;font-size:.78rem;color:var(--muted);margin-bottom:6px;">💰 Операции бюджета</div>';
      html += dayTxs.map(t => {
        const sign = t.type === 'income' ? '+' : '−';
        return `
          <div class="tx-item ${t.type}" style="margin-bottom:6px;border-bottom:1px solid var(--border);">
            <div class="tx-icon" style="background:${t.categoryColor}20;color:${t.categoryColor}">
              ${t.categoryEmoji}
            </div>
            <div class="tx-info">
              <div class="cat">${escapeHtml(t.categoryLabel)}</div>
              <div class="meta">${escapeHtml(t.author)}${t.note ? ' · ' + escapeHtml(t.note) : ''}</div>
            </div>
            <div class="tx-amount">${sign}${fmtMoney(t.amount)} ₽</div>
          </div>`;
      }).join('');
      html += '</div>';
    }

    if (dayEntries.length > 0) {
      html += '<div style="margin-bottom:12px;"><div style="font-weight:800;font-size:.78rem;color:var(--muted);margin-bottom:6px;">🏦 Копилка</div>';
      html += dayEntries.map(e => {
        const bills = [];
        if (e.breakdown[1000]) bills.push(`${e.breakdown[1000]}×1000`);
        if (e.breakdown[500])  bills.push(`${e.breakdown[500]}×500`);
        if (e.breakdown[200])  bills.push(`${e.breakdown[200]}×200`);
        if (e.breakdown[100])  bills.push(`${e.breakdown[100]}×100`);
        return `
          <div class="history-item" style="margin-bottom:6px;">
            <div>
              <span class="who">${escapeHtml(e.author)}</span>
              <div class="when">${bills.join(', ')}</div>
            </div>
            <div class="right">
              <span class="amount">+${fmtMoney(e.amount)} ₽</span>
            </div>
          </div>`;
      }).join('');
      html += '</div>';
    }

    $('dayListContent').innerHTML = html;

    const addBtn = document.createElement('button');
    addBtn.className = 'add-btn';
    addBtn.style.cssText = 'width:100%;justify-content:center;margin-top:8px;';
    addBtn.textContent = '＋ Добавить в этот день';
    addBtn.onclick = () => {
      closeDayList();
      openDayAction(dateStr, dateStrHuman);
    };
    $('dayListContent').appendChild(addBtn);

    $('modalDayList').classList.add('show');
  }

    STATE.pickedEmoji = '📌';
    STATE.pickedColor = '#7a99ac';
    $('catLabel').value = '';
    updateCatTypeButtons();
    renderEmojiPicker();
    renderColorPicker();
    $('modalCat').classList.add('show');
    vibrate('light');
  }
  function closeCatModal() { $('modalCat').classList.remove('show'); }

  function updateCatTypeButtons() {
    document.querySelectorAll('#catTypeToggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.type === STATE.catType);
    });
  }

  function renderEmojiPicker() {
    const wrap = $('emojiGrid');
    wrap.innerHTML = EMOJI_SET.map(e => `
      <button type="button" data-emoji="${e}"
              class="${STATE.pickedEmoji === e ? 'active' : ''}">
        ${e}
      </button>
    `).join('');
    wrap.querySelectorAll('button').forEach(b => {
      b.onclick = () => {
        STATE.pickedEmoji = b.dataset.emoji;
        renderEmojiPicker();
      };
    });
  }

  function renderColorPicker() {
    const wrap = $('colorGrid');
    wrap.innerHTML = COLOR_SET.map(c => `
      <button type="button" data-color="${c}"
              class="${STATE.pickedColor === c ? 'active' : ''}"
              style="background:${c};">
      </button>
    `).join('');
    wrap.querySelectorAll('button').forEach(b => {
      b.onclick = () => {
        STATE.pickedColor = b.dataset.color;
        renderColorPicker();
      };
    });
  }

  async function saveCategory() {
    const label = $('catLabel').value.trim();
    if (!label) { showToast('Введите название', true); return; }
    try {
      const res = await apiPost('/api/categories', {
        type: STATE.catType,
        label,
        emoji: STATE.pickedEmoji,
        color: STATE.pickedColor,
      });
      STATE.categories = res.categories;
      closeCatModal();
      showToast('Категория создана');

      // Если модалка транзакции открыта — обновим сетку категорий
      if ($('modalTx').classList.contains('show') &&
          STATE.catType === STATE.txType) {
        STATE.txCatId = res.category.id;
        renderTxCatGrid();
      } else {
        // обновляем данные в фоне без перерисовки
        await reload({ silent: true });
      }
    } catch (e) {
      showToast('Ошибка создания', true);
    }
  }

  // =================================================================
  // ==================== ИНИЦИАЛИЗАЦИЯ ==============================
  // =================================================================
  function init() {
    initTheme();

    document.querySelectorAll('.tabs button').forEach(btn => {
      btn.onclick = () => switchTab(btn.dataset.tab);
    });

    // Модалка копилки
    ['sv100', 'sv200', 'sv500', 'sv1000'].forEach(id => {
      $(id).oninput = updateSavingsTotal;
    });
    $('svCancel').onclick = closeSavingsModal;
    $('modalSavings').onclick = e => {
      if (e.target === $('modalSavings')) closeSavingsModal();
    };
    $('svSave').onclick = async () => {
      const date = $('svDate').value;
      const breakdown = {
        100: parseInt($('sv100').value) || 0,
        200: parseInt($('sv200').value) || 0,
        500: parseInt($('sv500').value) || 0,
        1000: parseInt($('sv1000').value) || 0,
      };
      const total = updateSavingsTotal();
      if (total <= 0) { showToast('Введите хотя бы одну купюру', true); return; }
      closeSavingsModal();
      try {
        await apiPost('/api/entries', { date, breakdown, author: STATE.currentUser });
        showToast(`+${fmtMoney(total)} ₽ отложено`);
        vibrate('success');
        await reload({ forceRender: true });
      } catch (e) {
        showToast('Ошибка сохранения', true);
        vibrate('error');
      }
    };

    // Модалка транзакции
    document.querySelectorAll('#txTypeToggle button').forEach(b => {
      b.onclick = () => {
        STATE.txType = b.dataset.type;
        STATE.txCatId = null;
        updateTxTypeButtons();
        renderTxCatGrid();
      };
    });
    $('txAddCatBtn').onclick = () => openCatModal(STATE.txType);
    $('txCancel').onclick = closeTxModal;
    $('txSave').onclick = saveTx;
    $('modalTx').onclick = e => {
      if (e.target === $('modalTx')) closeTxModal();
    };

    // Модалка категории
    document.querySelectorAll('#catTypeToggle button').forEach(b => {
      b.onclick = () => {
        STATE.catType = b.dataset.type;
        updateCatTypeButtons();
      };
    });
    $('catCancel').onclick = closeCatModal;
    $('catSave').onclick = saveCategory;
    $('modalCat').onclick = e => {
      if (e.target === $('modalCat')) closeCatModal();
    };

    // Модалка действий дня
    $('dayCancel').onclick = closeDayAction;
    $('modalDayAction').onclick = e => {
      if (e.target === $('modalDayAction')) closeDayAction();
    };
    $('dayAddIncome').onclick = () => {
      const date = STATE.selectedDateForAction;
      closeDayAction();
      openTxModal(date, 'income');
    };
    $('dayAddExpense').onclick = () => {
      const date = STATE.selectedDateForAction;
      closeDayAction();
      openTxModal(date, 'expense');
    };
    $('dayAddSavings').onclick = () => {
      const date = STATE.selectedDateForAction;
      closeDayAction();
      openSavingsModal(date);
    };

    // Модалка списка дня
    $('dayListClose').onclick = closeDayList;
    $('modalDayList').onclick = e => {
      if (e.target === $('modalDayList')) closeDayList();
    };

    // Первая загрузка
    reload();

    // Тихая автосинхронизация: если открыта модалка — вообще не дёргаем сервер
    setInterval(() => {
      if (document.hidden) return;
      if (document.querySelector('.modal-bg.show')) return;
      reload({ silent: true });
    }, 8000);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        if (document.querySelector('.modal-bg.show')) return;
        reload({ silent: true });
      }
    });
  }

  init();
})();
</script>
</body>
</html>
